name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  migrate-prod:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    environment: prod  # Requires approval if configured
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy python-dotenv
      
      - name: Run Alembic migrations
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "Running migrations against production database..."
            alembic upgrade head
            echo "Production migrations complete!"
          else
            echo "PROD_DATABASE_URL not set - skipping migrations"
            echo "This is expected for local-only development"
          fi
      
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 Production migrations completed successfully\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}\"}" \
            $SLACK_WEBHOOK_URL
      
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🔴 PRODUCTION migrations FAILED\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            $SLACK_WEBHOOK_URL
