# Deploy to Production -- DEFERRED
#
# This workflow is disabled (workflow_dispatch only, no automatic triggers).
# We are not merging to main yet. Re-enable when a production deployment
# target exists and the team is ready to promote code from dev to main.

name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy python-dotenv

      - name: Validate PROD_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set. Cannot deploy to production."
            exit 1
          fi

      - name: Run Alembic migrations
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running migrations against production database..."
          alembic -c alembic/alembic.ini upgrade head
          echo "Production migrations complete."
