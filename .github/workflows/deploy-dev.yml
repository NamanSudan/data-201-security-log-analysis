# Deploy to Dev -- DEFERRED
#
# This workflow is disabled (workflow_dispatch only, no automatic triggers).
#
# Our Postgres databases are local-only on each team member's machine.
# GitHub Actions runners cannot reach those databases, so automated
# post-merge migrations are not possible with the current setup.
#
# After code is merged to dev, each teammate should:
#   git checkout dev && git pull origin dev
#   alembic -c alembic/alembic.ini upgrade head
#   # run loaders locally as needed
#
# This workflow can be re-enabled in the future if the team sets up either:
#   - a cloud-hosted shared dev database reachable from GitHub Actions
#   - a self-hosted GitHub Actions runner on a specific machine that has
#     network access to a designated dev database
#
# To re-enable, replace workflow_dispatch with the appropriate trigger
# (e.g. workflow_run on CI success for the dev branch) and configure
# DEV_DATABASE_URL as a GitHub Actions secret in the dev environment.

name: Deploy to Dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  migrate-dev:
    name: Run Dev Migrations
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy python-dotenv

      - name: Validate DEV_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DEV_DATABASE_URL secret is not set. Cannot deploy to dev."
            exit 1
          fi

      - name: Run Alembic migrations
        env:
          APP_ENV: dev
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          echo "Running migrations against dev database..."
          alembic -c alembic/alembic.ini upgrade head
          echo "Migrations complete."
